name: Daily Order Report

on:
  schedule:
    # KST 08:40 = UTC 23:40 (전일 00:00~24:00 매출 1회)
    - cron: "40 23 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Manual run slot"
        required: true
        default: "test"
        type: choice
        options: [morning, midday, evening, test]
      backfill_days:
        description: "웹디비 daily_sales 백필 일수(0=평상시 리포트, N=최근 N일 매출만 채움)"
        required: false
        default: "0"

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine slot
        id: slot
        run: |
          # cron 시각으로 slot 자동 매핑
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          else
            echo "slot=morning" >> $GITHUB_OUTPUT
          fi

      - name: Run report
        env:
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_REFRESH_TOKEN: ${{ secrets.CAFE24_REFRESH_TOKEN }}
          NAVER_COMMERCE_CLIENT_ID: ${{ secrets.NAVER_COMMERCE_CLIENT_ID }}
          NAVER_COMMERCE_CLIENT_SECRET: ${{ secrets.NAVER_COMMERCE_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          BKS_SUPABASE_URL: ${{ secrets.BKS_SUPABASE_URL }}
          BKS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BKS_SUPABASE_SERVICE_ROLE_KEY }}
          TZ: Asia/Seoul
        run: |
          if [ "${{ github.event.inputs.backfill_days }}" != "" ] && [ "${{ github.event.inputs.backfill_days }}" != "0" ]; then
            python src/main.py --backfill-days=${{ github.event.inputs.backfill_days }}
          else
            python src/main.py --slot=${{ steps.slot.outputs.slot }}
          fi
